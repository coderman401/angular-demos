<h1 mat-dialog-title class="display">Your stats</h1>
<div mat-dialog-content>
  <table class="stats">
    <thead>
      <tr>
        <th></th>
        <th><ttt-mark type="X"></ttt-mark> X</th>
        <th><ttt-mark type="O"></ttt-mark> O</th>
        <th>Draw</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Single player</th>
        <td>{{ data.one.xWins }}</td>
        <td>{{ data.one.oWins }}</td>
        <td>{{ data.one.draw }}</td>
      </tr>
      <tr>
        <th scope="row">Two player</th>
        <td>{{ data.two.xWins }}</td>
        <td>{{ data.two.oWins }}</td>
        <td>{{ data.two.draw }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>OK</button>
</div>
