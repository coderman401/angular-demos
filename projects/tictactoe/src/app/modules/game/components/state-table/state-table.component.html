<h1 mat-dialog-title>Your stats</h1>
<div mat-dialog-content>
  <table class="stats">
    <thead>
      <tr>
        <th scope="col"><span class="sr">Mode</span></th>
        <th scope="col" class="x"><ttt-mark type="X"></ttt-mark><span class="sr">X wins</span></th>
        <th scope="col" class="o"><ttt-mark type="O"></ttt-mark><span class="sr">O wins</span></th>
        <th scope="col" class="d">Draws</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Computer</th>
        <td>{{ data.one.xWins }}</td>
        <td>{{ data.one.oWins }}</td>
        <td>{{ data.one.draw }}</td>
      </tr>
      <tr>
        <th scope="row">Pass &amp; play</th>
        <td>{{ data.two.xWins }}</td>
        <td>{{ data.two.oWins }}</td>
        <td>{{ data.two.draw }}</td>
      </tr>
    </tbody>
  </table>
  <p class="note">Against the computer you play O. Online games keep their own score per room.</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>OK</button>
</div>
