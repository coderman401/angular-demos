<div class="grid" role="group" aria-label="Tic tac toe board" [class.locked]="disabled">
  <button *ngFor="let i of cells" type="button" class="tile" [class.x]="squares[i] === 'X'"
    [class.o]="squares[i] === 'O'" [class.win]="winLine.includes(i)" [class.dim]="winLine.length && !winLine.includes(i)"
    [attr.aria-label]="label(i)" (click)="clickSquare(i)">
    <ttt-mark *ngIf="squares[i]" class="draw" [type]="squares[i]"></ttt-mark>
  </button>
</div>
